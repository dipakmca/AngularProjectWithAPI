<form (ngSubmit)="saveStudent()">
  <label>Student Name:</label>
  <input type="text" [(ngModel)]="student.studentName" name="studentName">

  <br><br>

  <label>Email:</label>
  <input type="email" [(ngModel)]="student.email" name="email">

  <br><br>
  <label>Password:</label>
  <input type="password" [(ngModel)]="student.password" name="password">

  <br><br>

  <label>Mobile:</label>
  <input type="text" [(ngModel)]="student.mobile" name="mobile">

  <br><br>

  <button type="submit">Register</button>

</form>
<a routerLink="/">Go Back</a>
